    boxes.forEach((b,i)=>{if(b.length<2)return;for(let c=0;c<3;c++){let lo=255,hi=0;for(const p of b){if(p[c]<lo)lo=p[c];if(p[c]>hi)hi=p[c]}const sc=(hi-lo)*Math.sqrt(b.length);if(sc>best){best=sc;bi=i;bc=c}}});

  const TL=[[21,38],[25,11],[44,26]],TR=TL.map(([x,y])=>[100-x,y]),IL=[[26,34],[27,18],[38,27]],IR=IL.map(([x,y])=>[100-x,y]);

// ===== 입력: 화면 직접 누르기, 기기 버튼, 키보드 =====
function input(k){
  const s=scr(),d=SCR[s.id];idle=0;
  if(k==='HOME'){ui.hc=-1;return goHome()}
  if(k==='BOOK'||k==='MENU'||k==='SET'){const id=k.toLowerCase();if(ui.stack[1]&&ui.stack[1].id===id)return goHome();ui.stack.length=1;return push(id)}
  if(k==='FEEDMENU'){if(ui.stack[1]&&ui.stack[1].id==='food')return goHome();ui.stack.length=1;render();return HOME_ICONS[0][2]()}
  if(k==='FEED'){if(ui.stack[1]&&ui.stack[1].id==='food')return goHome();if(stage()!=='egg')feedHint();return care('eat',1,0)}
  if(k==='PLAY')return care('play');
  if(k==='BACK'){if(s.id!=='home')back();else{ui.hc=-1;render()}return}
  if(s.id==='home'&&MODE==='console'){if(k==='OK')return state.poop.length&&stage()!=='egg'?cleanPoop(0):petTap();if(stage()==='egg')return;cat.tx=Math.max(0,Math.min(RW-64,cat.x+(k==='R'?24:-24)));cat.wait=30;if(calm)cat.x=cat.tx;return}
  if(s.id==='home'){
    if(k==='OK')return state.poop.length&&stage()!=='egg'?cleanPoop(0):petTap();return}
  if(s.id==='shop'){if(k==='OK')return shopOK(s);const n=shopLen(s);s.cur=(s.cur+(k==='R'?1:-1)+n)%n;if(s.cur<CATS.length)s.cat=s.cur;return render()}
  if(s.id==='buy'){if(k==='OK')return buyOK(s);s.cur=1-s.cur;return render()}
  if(s.id==='book'){if(k==='OK')return bookOK(s);const n=bookLen(s);s.cur=(s.cur+(k==='R'?1:-1)+n)%n;if(s.cur<BOOK_TABS.length)s.tab=s.cur;return render()}
  if(s.id==='place'){if(k==='OK')return petTap();cat.tx=Math.max(0,Math.min(RW-64,cat.x+(k==='R'?24:-24)));cat.wait=30;if(calm)cat.x=cat.tx;return}
  if(d.view){if(k==='OK')return d.ok?d.ok(s):back();const n=d.pages?d.pages():1;if(n>1){s.pg=(s.pg+(k==='R'?1:-1)+n)%n;render()}return}
  if(d.grid){const g=d.grid(s);if(k==='OK')return g[s.cur][2]();s.cur=(s.cur+(k==='R'?1:-1)+g.length)%g.length;return render()}
  const it=listOf(s);if(k==='OK')return it[s.cur].go();s.cur=(s.cur+(k==='R'?1:-1)+it.length)%it.length;render();
}
let SND=true;try{SND=localStorage.getItem('pikaSnd')!=='0'}catch(e){}
let AC=null;function beep(f,d){if(!SND)return;d=d||.06;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
let FH=false;try{FH=!!localStorage.getItem('pikaFH')}catch(e){}

function bindBtn(b,k){
  b.addEventListener('pointerdown',()=>beep(k==='OK'?660:k==='HOME'?440:540));
  if(k!=='OK'&&k!=='FEED'){b.onclick=()=>input(k);return}
  let t=0,lp=false;
  b.addEventListener('pointerdown',()=>{lp=false;t=setTimeout(()=>{lp=true;input(k==='OK'?'BACK':'FEEDMENU')},550)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',()=>{if(lp){lp=false;return}input(k)});
}

  if(t.closest('[data-ok]'))return input('OK');
  if(t.closest('[data-menu]'))return input('MENU');
  const hb=t.closest('[data-hb]');if(hb)return CONSOLE_BAR[+hb.dataset.hb][2]();
  const go=t.closest('[data-go]');if(go)return push(go.dataset.go);
  const fp=t.closest('[data-fprof]');if(fp)return push('prof',{fi:+fp.dataset.fprof});
  const h=t.closest('[data-h]');if(h){ui.hc=+h.dataset.h;return HOME_ICONS[ui.hc][2]()}
  const el=t.closest('[data-i]');if(!el)return;
  if(el.classList.contains('info'))return;
  s.cur=+el.dataset.i;if(s.id==='shop'&&s.cur<CATS.length)s.cat=s.cur;if(s.id==='book'&&s.cur<BOOK_TABS.length)s.tab=s.cur;input('OK');
});
rc.addEventListener('click',e=>{
  const sid=scr().id;if(sid!=='home'&&sid!=='place')return;
  const r=rc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*RW,y=(e.clientY-r.top)/r.height*RH,[sx,sy,sw,sh]=skyRect();
  if(sid==='home'){const pi=state.poop.findIndex(p=>x>=poopX(p)-2&&x<poopX(p)+18&&y>=FLOOR-16&&y<FLOOR+6);if(pi>=0)return cleanPoop(pi)}
  if(sid==='place'&&scr().place==='friend'&&x>RW-62&&y>CY+4&&y<FLOOR+2)return push('prof',{fi:scr().fi});
  if(x>cat.x+8&&x<cat.x+56&&y>CY+4&&y<FLOOR+2)return petTap();
  if(sid==='home'&&x>=sx&&x<sx+sw&&y>=sy&&y<sy+sh){skyMode=SKY4[(SKY4.indexOf(skyNow())+1)%4];return say(skyLine())}
  if(stage()!=='egg'&&y>FLOOR-30){cat.tx=Math.max(0,Math.min(RW-64,x-32));cat.wait=30;idle=0;if(calm)cat.x=cat.tx}
});
// 캐릭터 시트 미리 보기: 이미지를 기기 위로 끌어다 놓으면 바로 적용 (파일 이름에 egg/알, adult/어른이 있으면 그 단계, 아니면 어린이)
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(f=>{const n=f.name.toLowerCase(),w=/egg|알/.test(n)?'egg':/adult|어른/.test(n)?'adult':'child';const r=new FileReader();r.onload=()=>loadSheet(w,r.result);r.readAsDataURL(f)})});
new ResizeObserver(fitLCD).observe($('lcdwrap'));addEventListener('resize',layout);if(window.visualViewport)visualViewport.addEventListener('resize',layout);
applyPal(skin);document.documentElement.dataset.skin=skin;document.querySelectorAll('.spark').forEach(c=>paint(c,'spark'));

// ===== 시작 =====
const qs=Q.get('stage');
ShopAPI.load().then(r=>{
  state.coins=+Q.get('coins')||r.coins;state.earned=r.earned;state.owned=r.owned;r.owned.forEach(id=>equip(item(id),true));
  if(qs==='child'||qs==='adult')state.pets[0].hatched=true;
  if(qs==='adult')state.earned=Math.max(state.earned,GROW);
  layout();
  if(stage()==='egg')say('톡톡 눌러 줘!');
  setInterval(()=>{if(stage()!=='egg'&&scr().id==='home'&&!(ui.bub&&Date.now()<ui.bubT)&&Math.random()<.5)say(skyLine())},40000);
  draw();setInterval(()=>{draw();if(ui.toast&&Date.now()>ui.toastT&&scr().id!=='home'){ui.toast='';render()}},140);
});
</script>
