name: Publish rebuilt static room to tracked dist
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.mjs'
      - 'test/**'
      - '.github/workflows/publish-dist.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-dist-main
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public bundle from source
        run: npm run build
      - name: Verify console button geometry and rendering
        run: node --test test/controller-foreground-layout.test.mjs test/controller-single-layer.test.mjs test/console-button-geometry.test.mjs
      - name: Validate complete functionality
        run: npm test
      - name: Commit tested static assets for GitHub-connected deploy
        shell: bash
        run: |
          git add -f dist/index.html dist/storage.mjs dist/_headers dist/api/connection integration/worker-built.mjs
          if git diff --cached --quiet; then
            echo "dist/ is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish tested UI from current main [skip ci]"
          git push origin HEAD:main
