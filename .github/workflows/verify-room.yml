name: Verify room build and controls
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geumotseom-verify-main
  cancel-in-progress: true
jobs:
  room-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual public room bundle
        run: npm run build
      - name: Check generated console geometry
        run: node --test test/controller-foreground-layout.test.mjs test/controller-single-layer.test.mjs test/console-button-geometry.test.mjs
      - name: Verify P0 regression gate
        run: npm run test:p0
      - name: Run full regression suite
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pixel inspection dependency
        run: python -m pip install -r scripts/pixel-assets-requirements.txt
      - name: Verify pixel inspection tool
        run: python scripts/test_pixel_assets.py
      - name: Inspect existing room assets without replacing them
        run: python scripts/check_pixel_assets.py --baseline
      - name: Check new or modified pixel assets in changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_pixel_assets.py --changed "$BASE_COMMIT"
