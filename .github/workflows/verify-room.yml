name: Verify room build and camera placement
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  room-build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public room bundle
        run: npm run build
      - name: Test room assets, depth sorting and placement
        run: node --test test/selected-room-assets.test.mjs test/public-room-depth.test.mjs test/room-placement.test.mjs
